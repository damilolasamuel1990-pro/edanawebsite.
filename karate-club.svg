<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-label="Karate club illustration">
  <defs>
    <linearGradient id="karateBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2358c4"/>
      <stop offset="0.5" stop-color="#15397f"/>
      <stop offset="1" stop-color="#0a1f45"/>
    </linearGradient>
    <radialGradient id="karateSun" cx="50%" cy="42%" r="42%">
      <stop offset="0" stop-color="#f4b628"/>
      <stop offset="0.72" stop-color="#f4b628"/>
      <stop offset="0.74" stop-color="rgba(244,182,40,0.25)"/>
      <stop offset="1" stop-color="rgba(244,182,40,0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="550" fill="url(#karateBg)"/>

  <!-- sun / spotlight -->
  <circle cx="400" cy="250" r="190" fill="url(#karateSun)" opacity="0.85"/>

  <!-- karate figure (white gi) performing a kick -->
  <g transform="translate(395 300)">
    <!-- gi body -->
    <g fill="#ffffff">
      <!-- head -->
      <circle cx="-30" cy="-150" r="26"/>
      <!-- torso / jacket -->
      <path d="M-56 -126
               C -70 -92, -74 -58, -70 -26
               C -40 -36, -6 -36, 20 -24
               C 16 -60, 8 -96, -4 -126
               C -22 -134, -42 -134, -56 -126 Z"/>
      <!-- jacket fold -->
      <path d="M-62 -110 L -24 -40 L -36 -34 L -72 -96 Z" fill="#eef2fb"/>
      <!-- lead (punching) arm -->
      <path d="M-18 -104 C 24 -96, 70 -92, 112 -98 C 72 -78, 26 -80, -14 -86 Z"/>
      <!-- guard arm -->
      <path d="M-56 -104 C -86 -96, -112 -78, -126 -54 C -98 -72, -70 -84, -44 -90 Z"/>
      <!-- standing leg -->
      <path d="M-44 -26 C -48 22, -52 74, -58 124 C -46 126, -34 126, -26 124 C -24 72, -20 22, -20 -18 Z"/>
      <!-- kicking leg extended -->
      <path d="M-14 -22 C 40 -6, 96 8, 150 2 C 150 18, 146 30, 136 36 C 86 34, 34 20, -20 6 Z"/>
      <!-- foot -->
      <path d="M150 2 l26 -6 2 24 -24 6 z"/>
      <!-- standing foot -->
      <path d="M-58 124 l-22 6 4 20 26 -4 z"/>
    </g>
    <!-- black belt -->
    <path d="M-66 -30 C -40 -40, -4 -40, 22 -28 L 22 -12 C -6 -24, -42 -24, -66 -14 Z" fill="#14181f"/>
    <path d="M-30 -22 l-14 34 10 4 12 -32 z" fill="#14181f"/>
    <path d="M-16 -22 l10 34 10 -6 -10 -30 z" fill="#14181f"/>
  </g>

  <!-- decorative corner stars -->
  <g fill="#f4b628" opacity="0.9">
    <path d="M110 110 l7 17 17 7 -17 7 -7 17 -7-17 -17-7 17-7 z"/>
    <path d="M690 420 l6 14 14 6 -14 6 -6 14 -6-14 -14-6 14-6 z"/>
  </g>

  <!-- floor line -->
  <rect x="0" y="470" width="800" height="80" fill="rgba(0,0,0,0.25)"/>
</svg>
