<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-label="Founder photo placeholder">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4a9c"/>
      <stop offset="0.55" stop-color="#15397f"/>
      <stop offset="1" stop-color="#0a1f45"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#fbg)"/>

  <!-- person silhouette -->
  <g fill="rgba(255,255,255,0.16)">
    <circle cx="300" cy="300" r="115"/>
    <path d="M110 650 C 110 520, 190 455, 300 455 C 410 455, 490 520, 490 650 Z"/>
  </g>

  <!-- camera icon + helper text -->
  <g transform="translate(300 585)" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-42" y="-30" width="84" height="60" rx="10"/>
    <circle cx="0" cy="2" r="16"/>
    <path d="M-30 -30 l10 -14 h40 l10 14"/>
  </g>
  <text x="300" y="680" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Add founder's photo</text>
</svg>
